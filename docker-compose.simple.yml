version: '3.8'

services:
  # MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: negaihoshi_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: negaihoshi
      MYSQL_USER: negaihoshi
      MYSQL_PASSWORD: negaihoshi123
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - negaihoshi_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "negaihoshi", "-pnegaihoshi123"]
      timeout: 20s
      retries: 10
      start_period: 30s

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: negaihoshi_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - negaihoshi_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 20s
      retries: 10
      start_period: 10s

  # 后端服务
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: negaihoshi_backend
    restart: unless-stopped
    ports:
      - "9292:9292"
    environment:
      # 数据库配置
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=negaihoshi
      - DB_PASSWORD=negaihoshi123
      - DB_NAME=negaihoshi
      # Redis配置
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
      - REDIS_DB=0
      # 应用配置
      - TZ=Asia/Shanghai
      - GIN_MODE=release
    volumes:
      - ./config.json:/app/config.json:ro
      - ./logs:/app/logs
      - ./uploads:/app/uploads
      - ./avatars:/app/avatars
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - negaihoshi_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9292/api/health"]
      timeout: 30s
      retries: 5
      start_period: 40s

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local

networks:
  negaihoshi_network:
    driver: bridge
